     <main>
         <!--THIS SECTION IS FOR PLANNER -->
            <section id="planner" class="card">
               <h2>ACADEMIC PLANNER</h2>
               <p>Manage your daily academic tasks below:</p>
       
                <div class="planner-input">
                    <input type="text" id="taskInput"  list="categories" placeholder="Enter a new academic task...">
                    <datalist id="categories">
                       <option value="Study C Programming"></option>
                       <option value="Revise Lecture Notes"></option>
                       <option value="Complete Lab Assignment"></option>
                       <option value="Practice Coding Challenges"></option>
                       <option value="Prepare for Quiz"></option>
                    </datalist>

                    <button id="addTaskBtn">Add Task</button>
                    <p id="validationMessage" style="color: #ef4444; font-size: 0.85rem; margin-top: 5px; display: none;">
                    Please enter a task name!
                    </p>
                </div>
                <br/>
       
                <table id="plannerTable">
                  <tbody id="plannerTableBody"></tbody>
                </table>
            </section>
        </main>
